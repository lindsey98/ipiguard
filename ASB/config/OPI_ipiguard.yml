  # - escape_characters
  # - naive

# IPIGuard defense: the agent commits to its benign workflow plan before any tool runs; at runtime
# only planned tools (or read-only "Read" tools) are authorized, so the attacker tool an OPI
# observation tries to introduce is deferred instead of executed. Comment this line out to run the
# undefended baseline (to confirm ASR > 0 first).
#
# IPIGuard is a plan-then-execute defense, so keep the default workflow_mode (automatic); it does not
# apply to workflow_mode=react (that dynamic loop has no committed plan to gate against).
defense_type: ipiguard
